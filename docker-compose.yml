services:

  # RADARR
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:vpn"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - ${TIMEZONE}
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
    volumes:
      - ./radarr/config:/config
      - ${MEDIA_PATH}/arr/data:/data
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  # SONARR
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:vpn"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - ${TIMEZONE}
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
    volumes:
      - ./sonarr/config:/config
      - ${MEDIA_PATH}/arr/data:/data
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  # PROWLARR
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:vpn"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
    volumes:
      - ./prowlarr/config:/config
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  # BAZARR
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:vpn"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - ${TIMEZONE}
    volumes:
      - ./bazarr/config:/config
      - ${MEDIA_PATH}/arr/data:/data
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  # LIDARR
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:vpn"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
    volumes:
      - ./lidarr/config:/config
      - ${MEDIA_PATH}/arr/data:/data
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped
  
  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    user: "${PUID}:${PGID}"
    network_mode: "service:vpn"
    volumes:
      - ${MEDIA_PATH}/arr/data:/data
    environment:
      - UN_SONARR_0_URL=http://localhost:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/data/torrents
      - UN_RADARR_0_URL=http://localhost:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/data/torrents
      - UN_FOLDER_0_PATH=/data/downloads/auto_extract
    depends_on:
      vpn:
        condition: service_healthy
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
    restart: unless-stopped

  # JELLYFIN
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - JELLYFIN_PublishedServerUrl=http://${HOST_IP}:8096/ 
      - TZ=${TIMEZONE}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ${MEDIA_PATH}/arr/data/media:/media:ro
    network_mode: host
    runtime: nvidia
    restart: unless-stopped

  # VPN PIA
  vpn:
    image: thrnz/docker-wireguard-pia
    container_name: vpn-pia
    # Alternatively you may use ghcr.io
    #image: ghcr.io/thrnz/docker-wireguard-pia
    volumes:
      # Auth token is stored here
      - ./pia/pia:/pia
      # If enabled, the forwarded port is dumped to /pia-shared/port.dat for potential use in other containers
      - ./pia/pia-shared:/pia-shared
    ports:
      - 7878:7878 # Radarr
      - 8989:8989 # Sonarr
      - 9696:9696 # Prowlarr
      - 6767:6767 # Bazarr
      - 8686:8686 # Lidarr
      - 8080:8080 # WebUI di QBittorrent
    cap_add:
      - ALL
    environment:
      - LOC=${VPN_ZONE}
      - USER=${VPN_USER}
      - PASS=${VPN_PASS}
      - LOCAL_NETWORK=${LOCAL_SUBNET}
      - RECONNECT=1
      - PORT_FORWARDING=1
      - PORT_PERSIST=1
      - FIREWALL=0
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      # May as well disable ipv6. Should be blocked anyway.
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    
    restart: unless-stopped

  # QBITORRENT
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - ${TIMEZONE}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config
      - ${MEDIA_PATH}/arr/data/torrents:/data/torrents
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  
  # HELPER QBITTORRENT PORT
  qbt-port-helper:
    build: ./qbt-port-helper
    container_name: qbt-port-helper
    environment:
      - USER=${QBT_USER:-admin}
      - PASSWORD=${QBT_PSW:-adminadmin}
    volumes: 
      - ./pia/pia-shared:/pia-shared:ro
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:vpn"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TIMEZONE}
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pia:
  pia-shared: